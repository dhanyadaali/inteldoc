# Full stack in Docker:  docker compose up -d --build   ->  http://localhost:8000
#   db   PostgreSQL 16 (also reachable from the host on localhost:5433)
#   app  IntelDoc web app + pipeline (FastAPI, OCR, LLM calls)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inteldoc
      POSTGRES_PASSWORD: inteldoc
      POSTGRES_DB: inteldoc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inteldoc -d inteldoc"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: inteldoc-app
    env_file: .env                      # GROQ_API_KEY, optional DEMO_PASSWORD, policy defaults
    environment:
      # inside Docker the database is the "db" service, not localhost:5433
      DATABASE_URL: postgresql://inteldoc:inteldoc@db:5432/inteldoc
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads       # uploaded documents survive container restarts
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
